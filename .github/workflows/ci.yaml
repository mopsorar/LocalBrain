name: CI

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      FASTAPI_OTEL_AUTO_CONFIGURE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check dependencies
        run: python -m pip check
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag localbrain-api:ci .
      - name: Check image imports and volume permissions without models
        run: |
          docker run --rm --entrypoint python \
            --env OLLAMA_BASE_URL=http://ollama:11434 \
            --mount type=volume,destination=/app/data/chroma \
            --mount type=volume,destination=/app/documents/uploads \
            localbrain-api:ci -c '
          import os
          from app.config import Settings
          import app.main
          assert os.getuid() != 0
          settings = Settings()
          assert settings.ollama_base_url.host == "ollama"
          assert (settings.documents_dir / "fastapi.md").is_file()
          assert (settings.documents_dir / "postgresql.txt").is_file()
          for directory in (settings.chroma_persist_dir, settings.uploads_dir):
              probe = directory / ".ci-write-check"
              probe.write_text("ok", encoding="utf-8")
              probe.unlink()
          '
